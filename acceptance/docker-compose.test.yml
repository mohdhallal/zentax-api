services:

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: golang-api
      PGDATA: /var/lib/postgresql/data/pg17
    volumes:
      - ./postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U admin -d golang-api &&
          psql -U admin -d golang-api -tAc
          "SELECT to_regclass('public.internal_api_keys') IS NOT NULL" | grep -q t
      interval: 5s
      timeout: 2s
      retries: 10

  tester:
    image: golang:1.26.2
    restart: "no"
    working_dir: /app/acceptance
    volumes:
      - ..:/app
      - ${GOMODCACHE}:/root/go/pkg/mod
      - ${GOCACHE}:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: "postgres://admin:secret@postgres:5432/golang-api?sslmode=disable"
      GOPATH: /root/go
      GOPROXY: "file:///root/go/pkg/mod/cache/download,direct"
      GONOSUMDB: "git.dtone.com/*"
      GOPRIVATE: "git.dtone.com/*"
      TEST_FLAGS: "${TEST_FLAGS:--count=1 -p 1 -parallel 1 -timeout 120s}"
    command: bash -c "go test $TEST_FLAGS ./..."
